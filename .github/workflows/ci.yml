name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install
      - name: Run tests
        env:
          VAT_RATE: ${{ vars.VAT_RATE }}
        run: npm test

      - name: Use a secret safely
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Secret length: ${#API_KEY}"
          echo "Trying to print it: $API_KEY"